plugins {
    id 'com.android.application'
}

android {
    namespace 'co.rmz.tv'
    compileSdk 34

    defaultConfig {
        applicationId "co.rmz.tv"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
        debug {
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Sem dependencias externas: WebView puro (build rapido, apk pequeno).
dependencies {
}
